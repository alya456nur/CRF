<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="edit-profile-container">
            <!-- Avatar Icon -->
            <a href="/" class="avatar-icon">
                <i class="bi bi-person-circle"></i>
            </a>

            <!-- Upload Photo Button -->
            <div class="mt-3">
                <input type="file" id="uploadPhoto" class="form-control" accept="image/*">
            </div>

            <!-- Input Fields -->
            <form class="mt-4">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter your username" disabled>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" disabled>
                </div>
                <div class="mb-3">
                    <label for="bio" class="form-label">Bio</label>
                    <textarea class="form-control" id="bio" rows="3" placeholder="Tell us about yourself" disabled></textarea>
                </div>
            </form>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button type="button" id="editButton" class="btn btn-primary w-100 mb-2" onclick="enableEdit()">Edit Profile</button>
                <div id="saveCancelButtons" class="save-cancel-buttons" style="display: none;">
                    <button type="button" class="btn btn-success w-50 me-1" onclick="saveChanges()">Save Changes</button>
                    <button type="button" class="btn btn-danger w-50 ms-1" onclick="cancelEdit()">Cancel</button>
                </div>
                <button type="button" class="btn btn-secondary w-100 mt-2">Change Password</button>
                <button type="button" class="btn btn-secondary w-100 mt-2">Change Email</button>
            </div>
        </div>
    </div>

    <script>
        // Function to enable editing and toggle button visibility
        function enableEdit() {
            document.getElementById('username').disabled = false;
            document.getElementById('email').disabled = false;
            document.getElementById('bio').disabled = false;
            document.getElementById('editButton').style.display = 'none';
            document.getElementById('saveCancelButtons').style.display = 'flex';
        }

        // Function to save changes and revert to initial button state
        function saveChanges() {
            // Add code here to handle saving the data
            disableInputs();
            document.getElementById('editButton').style.display = 'block';
            document.getElementById('saveCancelButtons').style.display = 'none';
        }

        // Function to cancel editing and revert to initial button state
        function cancelEdit() {
            disableInputs();
            document.getElementById('editButton').style.display = 'block';
            document.getElementById('saveCancelButtons').style.display = 'none';
        }

        // Function to disable input fields
        function disableInputs() {
            document.getElementById('username').disabled = true;
            document.getElementById('email').disabled = true;
            document.getElementById('bio').disabled = true;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
